# Agent Factory — core middleware
#
#   docker compose -f deploy/compose/docker-compose.yml --env-file deploy/compose/.env.example up -d
#
# Core (default): postgres, redis, minio
# Apps:           docker compose --profile app up -d --build
# Engines:        see README.md — Coze / RAGFlow / Activepieces are opt-in and must not block P0

name: agent-factory

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-factory}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-factory}
      POSTGRES_DB: ${POSTGRES_DB:-factory}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - factory_pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-factory} -d ${POSTGRES_DB:-factory}"]
      interval: 5s
      timeout: 3s
      retries: 20

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - factory_redis:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

  minio:
    image: minio/minio:RELEASE.2024-12-18T13-15-44Z
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-factory}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-factorysecret}
    ports:
      - "${MINIO_API_PORT:-9000}:9000"
      - "${MINIO_CONSOLE_PORT:-9001}:9001"
    volumes:
      - factory_minio:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://127.0.0.1:9000/minio/health/live"]
      interval: 10s
      timeout: 5s
      retries: 20

  api:
    profiles: ["app"]
    build:
      context: ../../apps/api
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      HTTP_ADDR: ":8080"
      DATABASE_URL: postgres://${POSTGRES_USER:-factory}:${POSTGRES_PASSWORD:-factory}@postgres:5432/${POSTGRES_DB:-factory}?sslmode=disable
      DEV_TENANT_ID: ${DEV_TENANT_ID:-dev-tenant}
      ENABLE_CHASER: "true"
      DEMO_CHASE_AFTER: ${DEMO_CHASE_AFTER:-30s}
      CHASE_TICK: ${CHASE_TICK:-5s}
    ports:
      - "${API_PORT:-8080}:8080"
    depends_on:
      postgres:
        condition: service_healthy

  gateway:
    profiles: ["app"]
    build:
      context: ../../apps/channel-gateway
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      HTTP_ADDR: ":8081"
      API_BASE_URL: http://api:8080
    ports:
      - "${GATEWAY_PORT:-8081}:8081"
    depends_on:
      - api

  console:
    profiles: ["app"]
    build:
      context: ../../apps/console
      dockerfile: Dockerfile
      args:
        VITE_API_BASE: ${PUBLIC_API_BASE:-http://localhost:8080}
        VITE_GATEWAY_BASE: ${PUBLIC_GATEWAY_BASE:-http://localhost:8081}
        VITE_TENANT_ID: ${DEV_TENANT_ID:-dev-tenant}
        VITE_BRAND_NAME: ${BRAND_NAME:-Agent 工厂}
        VITE_BRAND_LOGO: ${BRAND_LOGO:-}
        VITE_THEME_COLOR: ${THEME_COLOR:-#1677ff}
    restart: unless-stopped
    ports:
      - "${CONSOLE_PORT:-5173}:80"
    depends_on:
      - api
      - gateway

volumes:
  factory_pg:
  factory_redis:
  factory_minio:
