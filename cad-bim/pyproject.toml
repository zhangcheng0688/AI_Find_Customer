[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "cad-bim"
version = "0.1.0"
description = "Neutral CAD/BIM pipeline: PDF/DXF/spec → IFC (Revit) and STEP (SolidWorks)"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "ifcopenshell>=0.8.0",
    "ezdxf>=1.3.0",
    "gmsh>=4.13.0",
    "pymupdf>=1.24.0",
    "numpy>=1.24.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[project.scripts]
cad-bim = "cad_bim.cli:main"

[tool.setuptools.packages.find]
include = ["cad_bim*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
